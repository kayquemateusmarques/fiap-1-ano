<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: rgb(0, 0, 0);
            margin: 0;
            padding: 0;
        }

        .scene {
            margin: 80px auto;
            width: 210px;
            position: relative;
            aspect-ratio: 4 / 5;
            perspective: 1000px;
        }

        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 30s infinite linear;
        }

        .carousel img {
            position: absolute;
            top: 0;
            left: 0;
            width: 190px;
            aspect-ratio: 4 / 5;
            border-radius: 10px;
            transform: rotateY(var(--i)) translateZ(288px);
        }

        @keyframes rotate {
            0% {
                transform: rotateY(360deg);

            }

            100% {
                transform: rotateY(0deg);

            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="carousel">
            <img src="1_marechal.jpeg" style="--i:000deg">
            <img src="2_floriano.jpeg" style="--i:040deg">
            <img src="3_prudentedemorais.jpeg" style="--i:080deg">
            <img src="4_sales.jpeg" style="--i:120deg">
            <img src="5_rodriguesalves.jpeg" style="--i:160deg">
            <img src="6_afonso.jpg" style="--i:200deg">
            <img src="6_afonso.jpeg" style="--i:240deg">
            <img src="8_nilopecanha.jpeg" style="--i:280deg">
            <img src="9_venceslau.jpeg" style="--i:320deg">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
